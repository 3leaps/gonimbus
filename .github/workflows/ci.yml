# yamllint disable rule:document-start
# yamllint disable rule:truthy
# CI workflow — container jobs use goneat-tools-runner-glibc v0.5.9, digest-pinned (see docs/development/ci.md).
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  # Container-based format checking (LOW friction - v0.3.14+)
  # Uses goneat-tools-runner which has foundation tools pre-installed
  format-check:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/fulmenhq/goneat-tools-runner-glibc:v0.5.9@sha256:412a315241a59fc0313f4e79f182f7f373a04f194174c61b439cf8ba26174d54
      # goneat-tools-runner is a full CI runner image.
      # Use UID 1001 to match GitHub-hosted runner workspace ownership.
      options: --user 1001
    # Force bash for all run: steps. The -glibc image does not expose bash as
    # GHA's default container shell, so GHA falls back to sh which lacks
    # `set -o pipefail`. Per-step `shell: bash` works too (see release.yml);
    # the job-level default is the same idea expressed once.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify foundation tools
        run: |
          set -euo pipefail
          prettier --version
          yamlfmt --version
          jq --version
          yq --version
          rg --version
      - name: Check formatting
        run: |
          set -euo pipefail
          yamlfmt -lint .
          prettier --check "**/*.{md,json}" || \
            echo "Prettier differences found (non-blocking)"
  # Build and test using goneat-tools-runner container
  # Runner provides foundation tools + goneat/sfetch; Go is set up separately.
  build-test:
    needs: [format-check]
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/fulmenhq/goneat-tools-runner-glibc:v0.5.9@sha256:412a315241a59fc0313f4e79f182f7f373a04f194174c61b439cf8ba26174d54
      # goneat-tools-runner is a full CI runner image.
      # Use UID 1001 to match GitHub-hosted runner workspace ownership.
      options: --user 1001
    # Force bash for run: steps; see format-check job for rationale.
    defaults:
      run:
        shell: bash
    env:
      FULMEN_WORKSPACE_ROOT: ${{ github.workspace }}
      # GOPATH points to a workspace-relative path because goneat-tools-runner
      # v0.3+ runs as non-root (UID 1001) and /opt/gopath/bin is not writable
      # by that user. actions/setup-go expects $GOPATH/bin to be writable.
      GOPATH: ${{ github.workspace }}/../_go
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare Go directories
        # Pre-create the writable workspace-relative GOPATH so actions/setup-go
        # does not fail with EACCES under the non-root runner user.
        run: mkdir -p "$GOPATH/bin" "$GOPATH/pkg"
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.26.9"
      - name: Verify runner + Go toolchain
        run: |
          set -euo pipefail
          prettier --version
          yamlfmt --version
          sfetch --version
          goneat --version
          command -v go
          go version
          go env GOPATH
          go mod download
      - name: Format (using goneat - fail on diff)
        run: |
          set -euo pipefail
          make fmt
          git diff --exit-code
      - name: API stability
        run: |
          set -euo pipefail
          make api-stability
      - name: Workflow pin and release permission checks
        run: |
          set -euo pipefail
          make release-workflow-check
      - name: Install golangci-lint (v2)
        # goneat-tools-runner does not ship golangci-lint yet.
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.11.2
          args: --help
      - name: Verify golangci-lint
        run: |
          set -euo pipefail
          golangci-lint --version
      - name: Lint
        run: |
          set -euo pipefail
          make lint
      - name: Test
        run: |
          set -euo pipefail
          make test
      # The child-process ownership rule is enforced structurally by committed
      # controls; this adds dynamic coverage of the same package under the race
      # detector, which catches a publication-order defect as it happens.
      - name: Test child-process ownership under the race detector
        run: |
          set -euo pipefail
          go test -race ./internal/ownedproc
      - name: Test libsql build tag
        run: |
          set -euo pipefail
          make test-libsql
      - name: Build binary
        run: |
          set -euo pipefail
          make build
      - name: Build libsql binary
        run: |
          set -euo pipefail
          go build -tags gonimbus_libsql ./cmd/gonimbus
      - name: Cross-compile default pure-Go graph
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          GOOS=linux GOARCH=arm64 go build ./...
  # The committed release pin and anchors are checked with gpg, which the
  # tool container does not ship; the hosted image does.
  release-anchors:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install checksum-pinned Decernor
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d "$RUNNER_TEMP/decernor.XXXXXX")"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            'https://github.com/3leaps/decernor/releases/download/v0.1.8/decernor_0.1.8_linux_amd64.tar.gz' \
            --output "$tool_dir/decernor_0.1.8_linux_amd64.tar.gz"
          (cd "$tool_dir" && sha256sum --check "$GITHUB_WORKSPACE/config/release/decernor-ci-sha256.txt")
          tar -xzf "$tool_dir/decernor_0.1.8_linux_amd64.tar.gz" -C "$tool_dir" decernor
          echo "GONIMBUS_DECERNOR_BIN=$tool_dir/decernor" >> "$GITHUB_ENV"
      - name: Check committed release pin and anchors
        run: |
          set -euo pipefail
          make release-anchors-check
  # Native Windows coverage for handle-relative job registry mutation, SQLite
  # snapshot binding, and leased GC quarantine/recovery. These cannot be
  # certified by cross-compilation because share masks, access masks,
  # replacement denial, reparse behavior, and open-lock deletion semantics are
  # enforced only by the Windows kernel.
  windows-jobregistry:
    needs: [format-check]
    name: windows-jobregistry (${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            goarch: amd64
          - runner: windows-latest-arm64-s
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.26.9"
      - name: Verify native runner architecture
        shell: pwsh
        run: |
          $actual = go env GOARCH
          if ($actual -ne '${{ matrix.goarch }}') {
            throw "Expected native GOARCH=${{ matrix.goarch }}, got $actual"
          }
          go version
      - name: Run native SQLite snapshot and driver-handle authority suite
        shell: pwsh
        run: go test ./pkg/indexstore -run '^(TestOpenLocalReadOnlyWindows|TestCanonicalSQLiteVFSRejectsHandleReuseAndUnrelatedMatchingOpen|TestOpenLocalMutableCanonicalRejectsSidecarsAppearingBeforeVFSCapture)$' -count=1 -v
      - name: Run native canonical SQLite writer and crash-recovery suite
        shell: pwsh
        run: go test ./pkg/indexreader -run '^(TestSQLiteIdentityPublicationGuardRetainsProofUntilMarkerBoundary|TestCanonicalMetadataPublicationRejectsSymlinksAndSwaps|TestOpenSQLiteWriteTarget.*|TestSQLiteWriteTargetCrashLeavesCanonicalRecoveryState)$' -count=1 -v
      - name: Run native leased index GC recovery suite
        shell: pwsh
        run: go test ./internal/cmd ./internal/indexsubstrate -run '^(TestRunIndexGC|TestAcquireWriteLeaseForMaintenance)' -count=1 -v
      # Set-authority lease detection and reclaim must be proven on native
      # Windows, not merely cross-compiled. Reclaim unlinks the lock file while
      # its descriptor still holds the lock, and Windows delete-while-open
      # semantics (FILE_SHARE_DELETE, delete-pending directory entries) differ
      # materially from Unix.
      #
      # What this step proves natively: the delete-while-open unlink of a
      # provably-unheld lease, the adversarial reclaim-versus-acquire race, and
      # the same delete-while-open removal on the completion path, where the
      # owner unlinks through the descriptor it already holds and a build's
      # own artifact must be gone at every trappable outcome.
      # What it does NOT prove: the anti-split binding-swap guard. Windows
      # refuses to rebind a pathname whose file is open and locked, so that
      # fixture is unconstructible and skips there — the OS prevents the swap
      # rather than our revalidation refusing it. The application-level guard is
      # exercised on Unix, where the swap can actually be staged. The same
      # applies to the owner-cleanup refusal, which stages the same swap, and to
      # the interrupt bridge, whose evidence needs a signal raised at a running
      # process; those skip here and are proven on Unix.
      - name: Run native set-authority lease detect, reclaim, and cleanup suite
        shell: pwsh
        run: go test ./internal/indexsubstrate ./pkg/indexcoord ./pkg/indexbuild ./internal/cmd ./internal/ownedproc -run '^(TestSetAuthority|TestReclaim_|TestRelease_|TestAcquire_|TestUnlinkUnderHeldLock|TestBuildLeavesNoSetAuthorityResidue|TestBuildReportsOwnerCleanupRefusal|TestIndexBuildSurfacesAuthorityCleanupRefusal|TestIndexBuildReportsBothCleanupAndUnpersistedCorrection|TestIndexBuildRecordsSuccessWithoutCleanupInterference|TestDemoteManagedJob|TestLease|TestEnumerateLeases|TestInvalidLease|TestReclaimUnheldLease|TestIndexLease|TestIndexDoctorCommandPath|TestGuardDoctorLeaseFlags|TestWithInterruptCancel|TestStopLeaves|TestStopSignals|TestSignalReaches)' -count=1 -v
      - name: Run native registry security suite
        shell: pwsh
        run: go test ./pkg/jobregistry -count=1 -v
      - name: Build native Windows CLI
        shell: pwsh
        run: go build ./cmd/gonimbus
  # Cloud integration tests with moto (S3 emulation)
  # Runs on main branch and PRs to catch S3 SDK issues
  cloud-integration:
    needs: [build-test]
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/fulmenhq/goneat-tools-runner-glibc:v0.5.9@sha256:412a315241a59fc0313f4e79f182f7f373a04f194174c61b439cf8ba26174d54
      options: --user 1001
    # Force bash for run: steps; see format-check job for rationale.
    defaults:
      run:
        shell: bash
    services:
      moto:
        image: motoserver/moto:5.2.3@sha256:91fd602a21f49cf9eb82fdf474015a3c131d40104c8297ea6a2ca920708ae32c
        ports:
          - 5555:5000
    env:
      MOTO_ENDPOINT: http://moto:5000
      FULMEN_WORKSPACE_ROOT: ${{ github.workspace }}
      # Workspace-relative GOPATH: see build-test job for rationale (non-root
      # runner user cannot write to the image's default /opt/gopath/bin).
      GOPATH: ${{ github.workspace }}/../_go
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare Go directories
        run: mkdir -p "$GOPATH/bin" "$GOPATH/pkg"
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.26.9"
      - name: Build binary
        run: |
          set -euo pipefail
          make build
      - name: Run cloud integration tests
        run: |
          set -euo pipefail
          go test ./... -v -tags=cloudintegration
