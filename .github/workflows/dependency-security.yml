# yamllint disable rule:document-start
# yamllint disable rule:truthy
name: Dependency Security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-security:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/fulmenhq/goneat-tools-runner-glibc:v0.5.14@sha256:2a98d8e9169d0b55f88ef7dbf3d26b05ec4780f1be8fc6672887d64831b60a13
      options: --user 1001
    defaults:
      run:
        shell: bash
    env:
      FULMEN_WORKSPACE_ROOT: ${{ github.workspace }}
      GOPATH: ${{ github.workspace }}/../_go
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare Go directories
        run: mkdir -p "$GOPATH/bin" "$GOPATH/pkg"
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.26.10"
      - name: Verify dependency security gate
        run: |
          set -euo pipefail
          goneat --version
          go version
          go mod download
          goneat assess --categories dependencies --check --fail-on high
